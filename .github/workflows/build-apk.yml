name: Build APK

# 手动触发：Actions -> Build APK -> Run workflow -> 填后端 API 地址
on:
  workflow_dispatch:
    inputs:
      api_host:
        description: '公网后端地址（server.js 部署地址，如 https://api.example.com）'
        required: true
        default: 'https://api.example.com'
      release:
        description: '构建 Release 包（true/false，默认 debug）'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 组装 Web 资源（注入后端地址）
        run: node tools/build_mobile.js --host "${{ github.event.inputs.api_host }}"

      - name: 安装 Capacitor 依赖
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: 生成并同步 Android 工程
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: 构建 APK
        working-directory: mobile/android
        run: |
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: 查找 APK
        id: apk
        working-directory: mobile/android
        run: |
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: lekaixin-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
