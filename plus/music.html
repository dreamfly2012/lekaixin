<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title>音乐播放页面</title>
    <script src="../js/jquery.min.js"></script>
	<script src="../js/mui.min.js"></script>
	<script src="../js/juicer-min.js"></script>
    <script type="text/javascript" src="../js/common.js"></script>
    <script type="text/javascript" src="../js/AudioPlayer.js"></script>
    <link href="../css/mui.min.css" rel="stylesheet"/>
    <link href="../css/music.css" rel="stylesheet"/>
    <script type="text/javascript" charset="UTF-8">
      	mui.init();
    </script>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
		<h1 class="mui-title">电台</h1>
	</header>

	<nav class="mui-bar mui-bar-tab">
		<a class="mui-tab-item" href="../index.html#tabbar">
			<span class="mui-icon mui-icon-home"></span>
			<span class="mui-tab-label">笑话</span>
		</a>
		<a class="mui-tab-item mui-active" href="../index.html#tabbar-with-radio">
			<span class="mui-icon mui-icon-email"></span>
			<span class="mui-tab-label">电台</span>
		</a>
		<a class="mui-tab-item" href="../index.html#tabbar-with-baijia">
			<span class="mui-icon mui-icon-contact"></span>
			<span class="mui-tab-label">百家</span>
		</a>
		<a class="mui-tab-item" href="../index.html#tabbar-with-about">
			<span class="mui-icon mui-icon-gear"></span>
			<span class="mui-tab-label">关于</span>
		</a>
	</nav>
	<div id="content">
		<script id="tpl" type="text/template">
		<div id="myAudio" style="margin:0 auto;">
			<audio preload="metadata">
				{@each channel as it,index}
				<source title="${it.artist} - ${it.title}" src="${it.url}" data-length="${it.length}" data-cover="${it.picture}" />
				{@/each}
			</audio>
		</div>
		</script>

	</div>

	<script>
		var access_host = (window.LK_API_HOST || (location.protocol + '//' + location.host)) + '/app_backend/';
		// 旧后端 www.80shihua.com 已失效，改为同源本地模拟接口（server.js）
		var channel_url = 'https://www.douban.com/j/app/radio/channels';
	</script>

	<script>

	function isArray(object) { 
		return object != null && typeof object == "object" && 
		'splice' in object && 'join' in object; 
	} 

	function parseLyric(text) {
    	//将文本分隔成一行一行，存入数组
    	var lines = text.split('\n'),
        //用于匹配时间的正则表达式，匹配的结果类似[xx:xx.xx]
        pattern = /\[\d{2}:\d{2}.\d{2}\]/g,
        //保存最终结果的数组
        result = [];
	    //去掉不含时间的行
	    while (!pattern.test(lines[0])) {
	        lines = lines.slice(1);
	    };
    	//上面用'\n'生成生成数组时，结果中最后一个为空元素，这里将去掉
    	lines[lines.length - 1].length === 0 && lines.pop();
    	lines.forEach(function(v /*数组元素值*/ , i /*元素索引*/ , a /*数组本身*/ ) {
	        //提取出时间[xx:xx.xx]
	        var time = v.match(pattern),
	        //提取歌词
	        value = v.replace(pattern, '');
	        //因为一行里面可能有多个时间，所以time有可能是[xx:xx.xx][xx:xx.xx][xx:xx.xx]的形式，需要进一步分隔
	        if(isArray(time)){
	        	time.forEach(function(v1, i1, a1) {
		            //去掉时间里的中括号得到xx:xx.xx
		            var t = v1.slice(1, -1).split(':');
		            //将结果压入最终数组
		            result.push([parseInt(t[0], 10) * 60 + parseFloat(t[1]), value]);
		        });
	        }
	        
	    });
	    //最后将结果数组中的元素按时间大小排序，以便保存之后正常显示歌词
	    result.sort(function(a, b) {
	        return a[0] - b[0];
	    });
	    return result;
	}

	function get_lrc(song){
		//console.log(song);
		$.ajax({
			type:"get",
			url:access_host+'getlrc.php?song='+song,//当你孤单你会想起谁
			dataType : 'json',
			async:true,
			success:function(result){
				var lrc = result.lrc;
		        $.ajax({
		        	type:"get",
					url:access_host+'getlrc_content.php?url='+lrc,
					dataType : 'html',
					async:true,
					success:function(result){
						lyric = parseLyric(result);
						//console.log(lyric);
						var lyricContainer = $('.music_lrc')[0];
						fragment = document.createDocumentFragment();
					    lyric.forEach(function(v, i, a) {
					        var line = document.createElement('li');
					        line.id = 'line-' + i;
					        line.textContent = v[1];
					        fragment.appendChild(line);
					    });
					    lyricContainer.appendChild(fragment);
					    //获取页面上的audio标签
						$('audio').bind("timeupdate", function(e) {
					        //遍历所有歌词，看哪句歌词的时间与当然时间吻合
						    for (var i = 0, l = lyric.length; i < l; i++) {
						    	if (this.currentTime> lyric[i][0]) {
						            //显示到页面
						            $('#line-'+i).css('color','yellow').siblings().css('color','white');
						            $('.music_lrc').css('margin-top','-'+21*i+'px');
						        };
						    };
					    });
					}
		        });
			}
		});
	}

	function getQuery(name){
		var reg = new RegExp('(^|&)'+name+'=([^&]*)(&|$)');
		var r = location.search.substr(1).match(reg);
		return r ? decodeURIComponent(r[2]) : null;
	}

	function loadMusic(channelid){
		$.ajax({
			type:"get",
			url:access_host+'getmusic.php?id='+channelid,
			dataType : 'json',
			async:true,
			success:function(result){
				//console.log(JSON.stringify(result.song));
				var data = {
					channel : result.song
				};
				var tpl = document.getElementById('tpl').innerHTML;
				var music_content = juicer(tpl, data);
				$("#content").html(music_content);
				$("#myAudio").initAudio();

				if (result.song && result.song.length) {
					get_lrc(result.song[0]['title']);
				}
			}
		});
	}

	/* 切歌同步歌词（增强真实感：每首歌有各自的歌词） */
	function currentSongTitle(){
		var idx = $('.music_list li.active').index();
		if (idx < 0) idx = 0;
		return $('#myAudio source').eq(idx).attr('title') || '';
	}
	function reloadLyricForCurrent(){
		var t = currentSongTitle();
		if (t) { $('.music_lrc').empty(); get_lrc(t); }
	}
	$(function(){
		// 点击上一首/下一首后同步歌词
		$(document).on('click', '.btn_next, .btn_previous', function(){
			setTimeout(reloadLyricForCurrent, 60);
		});
		// 点击歌单直接切歌并加载歌词
		$(document).on('click', '.music_list li', function(){
			var idx = $(this).index();
			var $srcs = $('#myAudio source');
			if (idx < 0 || idx >= $srcs.length) return;
			var audio = $('#myAudio audio')[0];
			if (!audio) return;
			audio.src = $srcs.eq(idx).prop('src');
			audio.play();
			reloadLyricForCurrent();
		});
		// 底部 tab 栏：跨页导航回首页对应 tab（用捕获阶段拦截，绕过 mui 的 preventDefault 拦截）
		document.addEventListener('click', function(e){
			var a = e.target.closest ? e.target.closest('.mui-bar-tab a') : null;
			if (!a) return;
			e.preventDefault();
			e.stopPropagation();
			location.href = a.getAttribute('href');
		}, true);
	});

	if (mui.os && mui.os.plus) {
		// 真机 5+ 环境
		mui.plusReady(function(){
			var self = plus.webview.currentWebview();
			loadMusic(self.channelid || getQuery('channelid') || 1);
		});
	} else {
		// 浏览器环境：参数通过 URL query 传递
		$(function(){ loadMusic(getQuery('channelid') || 1); });
	}

	</script>
</body>
</html>
