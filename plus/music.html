	<div id="content">
		<script id="tpl" type="text/template">
		<div id="myAudio" style="margin:0 auto;">
			<audio preload="metadata">
				{@each channel as it,index}
				<source title="${it.artist} - ${it.title}" src="${it.url}" data-length="${it.length}" data-cover="${it.picture}" />
				{@/each}
			</audio>
		</div>
		</script>

	</div>

	<script>
		var access_host = (window.LK_API_HOST || (location.protocol + '//' + location.host)) + '/app_backend/';
		// 旧后端 www.80shihua.com 已失效，改为同源本地模拟接口（server.js）
		var channel_url = 'https://www.douban.com/j/app/radio/channels';
	</script>

	<script>

	function isArray(object) { 
		return object != null && typeof object == "object" && 
		'splice' in object && 'join' in object; 
	} 

	function parseLyric(text) {
    	//将文本分隔成一行一行，存入数组
    	var lines = text.split('\n'),
        //用于匹配时间的正则表达式，匹配的结果类似[xx:xx.xx]
        pattern = /\[\d{2}:\d{2}.\d{2}\]/g,
        //保存最终结果的数组
        result = [];
	    //去掉不含时间的行（带 length 保护，避免空歌词死循环）
	    while (lines.length && !pattern.test(lines[0])) {
	        lines = lines.slice(1);
	    };
    	//上面用'\n'生成生成数组时，结果中最后一个为空元素，这里将去掉
    	lines.length && lines[lines.length - 1].length === 0 && lines.pop();
    	lines.forEach(function(v /*数组元素值*/ , i /*元素索引*/ , a /*数组本身*/ ) {
	        //提取出时间[xx:xx.xx]
	        var time = v.match(pattern),
	        //提取歌词
	        value = v.replace(pattern, '');
	        //因为一行里面可能有多个时间，所以time有可能是[xx:xx.xx][xx:xx.xx][xx:xx.xx]的形式，需要进一步分隔
	        if(isArray(time)){
	        	time.forEach(function(v1, i1, a1) {
		            //去掉时间里的中括号得到xx:xx.xx
		            var t = v1.slice(1, -1).split(':');
		            //将结果压入最终数组
		            result.push([parseInt(t[0], 10) * 60 + parseFloat(t[1]), value]);
		        });
	        }
	        
	    });
	    //最后将结果数组中的元素按时间大小排序，以便保存之后正常显示歌词
	    result.sort(function(a, b) {
	        return a[0] - b[0];
	    });
	    return result;
	}

// 歌词请求令牌：切歌后旧请求的回调直接丢弃，避免歌词错插
var lrcToken = 0;
function get_lrc(song, token){
	//console.log(song);
	$.ajax({
		type:"get",
		url:access_host+'getlrc.php?song='+song,//当你孤单你会想起谁
		dataType : 'json',
		async:true,
		success:function(result){
			var lrc = result.lrc;
	        $.ajax({
	        	type:"get",
				url:access_host+'getlrc_content.php?url='+lrc,
				dataType : 'html',
				async:true,
				success:function(result){
					if (token !== lrcToken) return; // 已切歌，丢弃
					lyric = parseLyric(result);
					// 歌词数据交给播放器引擎同步（AudioPlayer.js 提供的 LK_LYRIC_SYNC），
					// 进度条刷新由其内部 rAF/timeupdate 驱动，互不干扰
					window.LK_LYRIC = lyric;
					var $ul = $('.music_lrc');
					if (!$ul.length) return;
					$ul.empty();
					var fragment = document.createDocumentFragment();
				    lyric.forEach(function(v, i, a) {
				        var line = document.createElement('li');
				        line.id = 'line-' + i;
				        line.textContent = v[1];
				        fragment.appendChild(line);
				    });
				    $ul[0].appendChild(fragment);
				    if (window.LK_LYRIC_RESET) window.LK_LYRIC_RESET();
				    if (window.LK_LYRIC_SYNC) {
				        var audio = $('#myAudio audio')[0];
				        window.LK_LYRIC_SYNC(audio ? audio.currentTime : 0);
				    }
				}
	        });
		}
	});
}

	function getQuery(name){
		var reg = new RegExp('(^|&)'+name+'=([^&]*)(&|$)');
		var r = location.search.substr(1).match(reg);
		return r ? decodeURIComponent(r[2]) : null;
	}

	function loadMusic(channelid){
		$.ajax({
			type:"get",
			url:access_host+'getmusic.php?id='+channelid,
			dataType : 'json',
			async:true,
			success:function(result){
				//console.log(JSON.stringify(result.song));
				var data = {
					channel : result.song
				};
				var tpl = document.getElementById('tpl').innerHTML;
				var music_content = juicer(tpl, data);
				$("#content").html(music_content);
			$("#myAudio").initAudio();

			if (result.song && result.song.length) {
				get_lrc(result.song[0]['title'], ++lrcToken);
			}
			}
		});
	}

/* 切歌同步歌词（增强真实感：每首歌有各自的歌词） */
function currentSongTitle(){
	// 优先走播放器 API：返回纯歌名（与歌词检索 key 一致）
	var audio = $('#myAudio audio')[0];
	if (audio && audio.lkPlayer) return audio.lkPlayer.titleAt(audio.lkPlayer.index());
	var idx = $('.music_list li.active').index();
	if (idx < 0) idx = 0;
	return $('#myAudio source').eq(idx).attr('title') || '';
}
function reloadLyricForCurrent(){
	var t = currentSongTitle();
	if (t) { $('.music_lrc').empty(); get_lrc(t, ++lrcToken); }
}
$(function(){
	// 切歌事件由 AudioPlayer 统一派发（含自动接歌），这里只负责刷新歌词
	$(document).on('lk:songchange', function(){
		reloadLyricForCurrent();
	});
	// 点击歌单直接切歌并加载歌词（走播放器 API，保证索引/封面/进度同步）
	// 同时监听 tap：MUI 的 pullRefresh / 手势层会吃掉 click，tap 才是移动端可靠信号
	var lkLastSongTap = 0;
	function lkSongTapHandler(){
		var now = Date.now();
		if (now - lkLastSongTap < 400) return;
		lkLastSongTap = now;
		var audio = $('#myAudio audio')[0];
		if (audio && audio.lkPlayer) audio.lkPlayer.playIndex($(this).index());
	}
	$(document).on('click', '.music_list li', lkSongTapHandler);
	$(document).on('tap', '.music_list li', lkSongTapHandler);
		// 底部 tab 栏：跨页导航回首页对应 tab
		// 用捕获阶段拦截 click + 监听 tap，兼容移动端（MUI 手势层会吃掉 click）
		var lkTabNav = 0;
		function lkGoTab(a){
			var now = Date.now();
			if (now - lkTabNav < 400) return;
			lkTabNav = now;
			location.href = a.getAttribute('href');
		}
		document.addEventListener('click', function(e){
			var a = e.target.closest ? e.target.closest('.mui-bar-tab a') : null;
			if (!a) return;
			e.preventDefault();
			e.stopPropagation();
			lkGoTab(a);
		}, true);
		document.addEventListener('tap', function(e){
			var a = e.target.closest ? e.target.closest('.mui-bar-tab a') : null;
			if (!a) return;
			lkGoTab(a);
		}, true);
	});

	if (mui.os && mui.os.plus) {
		// 真机 5+ 环境
		mui.plusReady(function(){
			var self = plus.webview.currentWebview();
			loadMusic(self.channelid || getQuery('channelid') || 1);
		});
	} else {
		// 浏览器环境：参数通过 URL query 传递
		$(function(){ loadMusic(getQuery('channelid') || 1); });
	}

	</script>
