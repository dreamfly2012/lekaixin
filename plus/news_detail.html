<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
		<title>资讯详情</title>
		<script src="../js/jquery.min.js"></script>
		<script src="../js/mui.min.js"></script>
		<script src="../js/common.js"></script>
		<link href="../css/mui.min.css" rel="stylesheet"/>
		<style>
			body{background:#f5f5f5;}
			.news-cover{width:100%;max-height:260px;object-fit:cover;display:block;background:#e9e9e9;}
			.news-body{padding:16px;background:#fff;}
			.news-title{font-size:20px;font-weight:700;line-height:1.4;margin:0 0 8px;color:#222;}
			.news-meta{color:#595959;font-size:12px;margin-bottom:14px;}
			.news-summary{font-size:15px;line-height:1.85;color:#333;white-space:pre-wrap;word-break:break-word;}
			.news-link{margin-top:22px;}
			.news-loading{color:#999;font-size:13px;text-align:center;padding:18px 0 4px;}
			/* 原文正文排版 */
			.news-article{font-size:16px;line-height:1.85;color:#333;word-break:break-word;}
			.news-article p{margin:0 0 14px;}
			.news-article img{max-width:100%;height:auto;display:block;margin:12px auto;border-radius:6px;}
			.news-article h1,.news-article h2{font-size:18px;line-height:1.5;margin:20px 0 10px;color:#222;}
			.news-article h3,.news-article h4,.news-article h5{font-size:16px;line-height:1.5;margin:16px 0 8px;color:#222;}
			.news-article blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid #d5d5d5;background:#fafafa;color:#555;border-radius:0 6px 6px 0;}
			.news-article ul,.news-article ol{padding-left:22px;margin:0 0 14px;}
			.news-article li{margin-bottom:6px;}
			.news-article a{color:#1976d2;text-decoration:none;}
			.news-article table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0;}
			.news-article th,.news-article td{border:1px solid #e5e5e5;padding:6px 8px;text-align:left;}
			.news-article pre{background:#f6f6f6;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;}
			.news-article hr{border:none;border-top:1px solid #eee;margin:18px 0;}
		</style>
		<script type="text/javascript" charset="UTF-8">
			mui.init();
		</script>
	</head>
	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left" id="backBtn"></a>
			<h1 class="mui-title">资讯</h1>
		</header>
		<div class="mui-content" style="padding-top:44px;">
			<img id="cover" class="news-cover" style="display:none;">
			<div class="news-body">
				<h1 class="news-title" id="title"></h1>
				<div class="news-meta" id="meta"></div>
				<div class="news-summary" id="summary"></div>
				<div id="loading" class="news-loading" style="display:none;">正在加载全文…</div>
				<div id="article" class="news-article" style="display:none;"></div>
				<a id="origin" class="mui-btn mui-btn-block mui-btn-primary news-link" style="display:none;">阅读原文 ↗</a>
			</div>
		</div>
		<script>
			var access_host = (window.LK_API_HOST || (location.protocol + '//' + location.host)) + '/app_backend/';

			function getQuery(name){
				var reg = new RegExp('(^|&)'+name+'=([^&]*)(&|$)');
				var r = location.search.substr(1).match(reg);
				return r ? decodeURIComponent(r[2]) : '';
			}

			// RSS 时间 -> "MM-DD HH:mm"，失败返回空串
			function formatTime(s){
				if (!s) return '';
				var d = new Date(s);
				if (isNaN(d.getTime())) return '';
				var p = function(v){ return (v<10?'0':'')+v; };
				return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
			}

			var title = getQuery('title') || '资讯';
			var img = getQuery('img') || '';
			var summary = getQuery('summary') || '';
			var source = getQuery('source') || '';
			var time = getQuery('time') || '';
			var url = getQuery('url') || '';

			document.title = title;
			$('.mui-title').text('资讯');
			$('#title').text(title);
			$('#summary').text(summary);
			if (source || time) {
				$('#meta').text([source, formatTime(time)].filter(function(v){return !!v;}).join(' · '));
			}
			if (img) {
				$('#cover').attr('src', img).show().on('error', function(){ $(this).hide(); });
			}
			if (url) {
				$('#origin').attr('href', url).show();
			}

			// 抓取原文全文，成功后替换摘要；失败保留摘要 + 阅读原文
			if (url) {
				$('#loading').show();
				$.ajax({
					url: access_host + 'getnews_content.php',
					data: { url: url },
					dataType: 'json',
					timeout: 15000
				}).done(function(r){
					if (r && r.ok && r.html) {
						$('#summary').hide();
						$('#article').html(r.html).show();
					}
				}).fail(function(){
					// 网络异常：静默保留摘要
				}).always(function(){
					$('#loading').hide();
				});
			}

			// 浏览器环境：mui-action-back 不生效，改为 history.back
			$('#backBtn').on('click', function(){
				if (!(mui.os && mui.os.plus)) { history.back(); }
			});
		</script>
	</body>
</html>
